services:

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: smartcollector
      APP_USER_PASSWORD: smartcollector
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  app:
    build: .
    container_name: smartcollector-app
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: smartcollector
      DB_PASSWORD: smartcollector
      JWT_SECRET: smartcollector-secret-key-2024

volumes:
  oracle_data:
