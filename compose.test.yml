# Ambiente exclusivo de testes. Credenciais abaixo sao apenas de teste local.
services:
  oracle-test:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: oracle_test_only
      APP_USER: smartcollector_test
      APP_USER_PASSWORD: smartcollector_test_only
    volumes:
      - oracle_test_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  tests:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    depends_on:
      oracle-test:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@oracle-test:1521/FREEPDB1
      DB_USER: smartcollector_test
      DB_PASSWORD: smartcollector_test_only
      JWT_SECRET: jwt_secret_for_automated_tests_only
    volumes:
      - ./pom.xml:/source/pom.xml:ro
      - ./src:/source/src:ro
      - maven_test_cache:/root/.m2
    command: ["sh", "-c", "cp /source/pom.xml /workspace/pom.xml && cp -R /source/src /workspace/src && exec mvn -B -ntp clean verify"]

volumes:
  oracle_test_data:
  maven_test_cache:
